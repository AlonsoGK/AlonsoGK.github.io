<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Box Model Practice</title>
        <script src="../validate.js"></script>
        <style>
            #redbox{
                 background-color:red;
                 height:100px;
                 width:100px;
                 border:2px black solid;
                 background-clip:content-box;
                 margin-left:300px;
            }
            #bluebox{
                background-color:blue;
                height:100px;
                width:100px;
                padding:100px;
                border:2px black solid;
                background-clip:content-box;
                margin-left:400px;
            }
            #greenbox{
                background-color:green;
                height:100px;
                width:100px;
                padding-left:25px;
                border:2px black solid;
                background-clip:content-box;
                margin-top:50px;
            }
            #yellowbox{
                background-color:yellow;
                height:100px;
                width:100px;
                padding-top:50px;
                padding-left:25px;
                padding-right:25px;
                border:2px black solid;
                background-clip:content-box;
                margin-top:50px;
                margin-left:400px;
            }
            #purplebox{
                background-color:purple;
                height:100px;
                width:100px;
                padding-bottom:100px;
                border:2px black solid;
                background-clip:content-box;
                margin-left:300px;
            }
        </style>
    </head>
    <body>
        <h1>Here are some boxes</h1>
        <div id="redbox"></div>
        <div id="bluebox"></div>
        <div id="greenbox"></div>
        <div id="yellowbox"></div>
        <div id="purplebox"></div>
    </body>
    </html>
