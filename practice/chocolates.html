<html>
    <head>
        <style>
            body{
                background: linear-gradient(135deg, #1a2980, #26d0ce);
                height: 100vh;
            }
            h1{
                text-align: center;
                font-family: Tahoma, sans-serif;
                color: white;
            }
            .container {
              display: grid;
              width: 80vw;
              height: 80vh;
              margin: auto;
              grid-template-columns: 1fr 1fr 1fr;
              grid-template-rows: 1fr 1fr 1fr;
              background-color: Thistle;
              padding: 10px;
              border-radius: 20px;
              border: 8px solid red;
            }
            .heart {
              height: 20vh; /* adjust to control the size */
              aspect-ratio: 1;
              --_m: radial-gradient(#000 69%,#0000 70%) 84.5%/50%;
              -webkit-mask-box-image: var(--_m);
                         mask-border: var(--_m);
              clip-path: polygon(-41% 0,50% 91%, 141% 0);
              background-color: chocolate;
              margin: auto;
            }
            /* fallback until better support for mask-border */
            @supports not (-webkit-mask-box-image: var(--_m)) { 
              .heart {
                mask:
                 radial-gradient(at 70% 31%,#000 29%,#0000 30%),
                 radial-gradient(at 30% 31%,#000 29%,#0000 30%),
                 conic-gradient(#000 0 0) bottom/100% 50% no-repeat;
              }
            }
            #chocolateheart{
                grid-column-start: 3;
                grid-row-start:2;
            }
            .lilbits{
                grid-column-start: 1;
                grid-row-start: 1;
                display: grid;
              grid-template-columns: 1fr 1fr 1fr;
              grid-template-rows: 1fr 1fr 1fr;
            }
            .mnm{
                grid-column-start:1;
                grid-row-start:1;
                width:10vh;
                height:10vh;
                background-color:red;
                border-radius:50%;
                margin: auto;
                display: grid;
                place-items: center;
                font-size: 2em;
            }
            #m1{
                grid-column:1/2;
            }
            #m2{
                grid-column:2/3;
            }
            #m3{
                grid-column:3/4;
            }
            #m4{
                grid-column:1/2;
                grid-row:2/3;
            }
            #m5{
                grid-column:2/3;
                Grid-row:2/3;
            }
            #m6{
                grid-column:3/4;
                grid-row:2/3;
            }
            </style>
    </head>
    <body>
        <h1>Here, I got you some chocolates &lt;3</h1>
        <div class="container">
            <div class="heart" id="chocolateheart"></div>
            <div class="lilbits">
                <div class="mnm" id="m1">
                m
                </div>
                <div class="mnm" id="m2">
                m
                </div>
                <div class="mnm" id="m3">
                m
                </div>
                <div class="mnm" id="m4">
                    m
                </div>
                <div class="mnm" id="m5">
                    m
                </div>
                <div class="mnm" id="m6">
                    m
                </div>
                <div class="starburst" id="starbusrt1">
                </div>

                <!-- TODO: Add some more divs here, and style them
                    to fill in the 'lilbits' part of the chocolate box -->
            </div>
            <div class="star" id="star">
            </div>
            <div class="hexagon" id="triangle">
            </div>
            <div class="triangle" id="triangle">
            </div>
            <div class="trapezoid" id="trapezoid">
            </div>
            <div class="starburst" id="starburst">
            </div>
            <!-- TODO: Add some more divs here, and style them
                to fill in the other sections of the chocolate box -->
        </div>
    </body>
</html>
